[workspace]
members = [
    "crates/core",
    "crates/hooks",
    "crates/actions",
    "crates/constraints",
    "crates/script",
    "crates/store",
    "crates/interact",
    "crates/app",
]
resolver = "2"

[workspace.dependencies]
korkuma-core        = { path = "crates/core" }
korkuma-hooks       = { path = "crates/hooks" }
korkuma-actions     = { path = "crates/actions" }
korkuma-constraints = { path = "crates/constraints" }
korkuma-script      = { path = "crates/script" }
korkuma-store       = { path = "crates/store" }
korkuma-interact    = { path = "crates/interact" }

serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
uuid              = { version = "1", features = ["v4", "serde"] }
thiserror         = "2"
crossbeam-channel = "0.5"
notify            = "6"
rhai              = "1"
slint             = "1.16.1"
async-trait       = "0.1"
futures           = "0.3"
tokio             = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
